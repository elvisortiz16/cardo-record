plugins {
    id 'com.android.application'
}

android {
    namespace 'com.mycompany.cardorecorder'
    compileSdk 35

    defaultConfig {
        applicationId 'com.mycompany.cardorecorder'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            // Demo: firma release con la debug key para que el APK sea instalable.
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
